name: ContinuityX CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/continuityx_test?schema=public"
      NEXTAUTH_SECRET: "ci-test-mock-secret-key-at-least-32-chars-long"
      NEXTAUTH_URL: "http://localhost:3000"
      STORAGE_DRIVER: "local"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run ESLint
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Run unit & hermetic tests
        run: npm test

      - name: Build Next.js application
        run: npm run build
